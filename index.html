<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="個人的に使用するTodoアプリです。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--リセットCSS-->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <title>Todoアプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>TODO LIST</h1>
    <form id="todo-form">
        <input id="todo-input" class="todo-input" type="text" placeholder="TODOを入力してください。">
        <button class="todo-button" type="submit">追加</button>
    </form>
    <ul id="todo-list"></ul>
<script src="js/script.js"></script>
</body>
</html>
